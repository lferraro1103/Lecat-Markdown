<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' claro-media: data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'"><title>Lecat - Markdown</title><script src="startup-theme.js"></script><link rel="stylesheet" href="bundle.css"><link rel="stylesheet" href="style.css"></head><body>
<header class="appbar"><div class="brand"><img src="../../branding/Lecat.png" alt=""><strong>Lecat - Markdown</strong><span class="version">3</span></div><div class="app-actions"><button data-command="new" title="Nuevo · Ctrl+N"><i data-lucide="file-plus"></i>Nuevo</button><button data-command="open" title="Abrir · Ctrl+O"><i data-lucide="file-text"></i>Abrir</button><button data-command="save" class="primary" title="Guardar · Ctrl+S"><i data-lucide="save"></i>Guardar</button><button data-command="theme" title="Cambiar tema · Ctrl+Shift+T" aria-label="Cambiar tema"><i data-lucide="sun-moon"></i></button></div></header>
<div class="workspace"><aside id="sidebar"><div class="side-header"><strong>EXPLORADOR</strong><button data-command="folder" title="Abrir carpeta" aria-label="Abrir carpeta"><i data-lucide="folder-open"></i></button></div><nav id="places" aria-label="Carpetas y discos"></nav><div class="folder-nav"><button id="up" title="Carpeta superior" aria-label="Carpeta superior"><i data-lucide="arrow-up"></i></button><input id="path" aria-label="Ruta de carpeta" placeholder="Escribí una ruta…"><button id="refresh" title="Actualizar carpeta" aria-label="Actualizar carpeta"><i data-lucide="refresh-cw"></i></button></div><div class="filter"><i data-lucide="search"></i><input id="filter" placeholder="Filtrar archivos y carpetas" aria-label="Filtrar archivos y carpetas"></div><div id="files" role="list" aria-label="Archivos y carpetas"></div></aside>
<main class="document"><div id="tabs" role="tablist" aria-label="Documentos abiertos"></div><div class="document-header"><div><h1 id="doc-title">Sin título</h1><p id="doc-path">Documento Markdown</p></div><span id="save-state" class="badge">Guardado</span></div><div class="document-controls"><div class="segmented" aria-label="Modo del documento"><button data-command="read"><i data-lucide="book-open"></i>Lectura</button><button data-command="edit"><i data-lucide="pencil"></i>Edición</button><button data-command="split"><i data-lucide="columns-2"></i>Código</button></div><div class="view-actions"><button data-command="search" title="Buscar y reemplazar · Ctrl+F" aria-label="Buscar y reemplazar"><i data-lucide="search"></i></button><button data-command="outline" title="Índice" aria-label="Índice"><i data-lucide="list-tree"></i></button><button data-command="focus" title="Modo enfoque" aria-label="Modo enfoque"><i data-lucide="maximize"></i></button><button data-command="zoomOut" title="Alejar" aria-label="Alejar"><i data-lucide="minus"></i></button><span id="zoom">100%</span><button data-command="zoomIn" title="Acercar" aria-label="Acercar"><i data-lucide="plus"></i></button></div></div>
<div id="formatbar" aria-label="Formato Markdown"><button data-command="heading" title="Encabezado"><i data-lucide="heading-2"></i></button><button data-command="bold" title="Negrita · Ctrl+B"><i data-lucide="bold"></i></button><button data-command="italic" title="Cursiva · Ctrl+I"><i data-lucide="italic"></i></button><span class="divider"></span><button data-command="link" title="Enlace"><i data-lucide="link"></i></button><button data-command="image" title="Imagen"><i data-lucide="image"></i></button><button data-command="list" title="Lista"><i data-lucide="list"></i></button><button data-command="task" title="Tarea"><i data-lucide="list-checks"></i></button><button data-command="quote" title="Cita"><i data-lucide="quote"></i></button><button data-command="code" title="Código"><i data-lucide="code"></i></button><button data-command="table" title="Tabla"><i data-lucide="table"></i></button><button data-command="diagram" title="Diagrama Mermaid"><i data-lucide="workflow"></i></button><span class="format-hint">Editá directamente el documento</span></div>
<div id="panes" data-mode="edit"><section id="visual-pane" aria-label="Edición visual"><div class="pane-label">DOCUMENTO EDITABLE · HACÉ CLIC PARA ESCRIBIR</div><div id="table-tools" hidden aria-label="Editar tabla"><button data-table="row">Fila +</button><button data-table="column">Columna +</button><button data-table="deleteRow">Quitar fila</button><button data-table="deleteColumn">Quitar columna</button><button data-table="delete">Quitar tabla</button></div><div id="visual-scroll"><div id="visual-editor"></div></div><div id="visual-search" hidden><input id="visual-find" aria-label="Buscar en el documento" placeholder="Buscar…"><input id="visual-replace" aria-label="Reemplazar texto" placeholder="Reemplazar…"><button data-search="previous">Anterior</button><button data-search="next">Siguiente</button><button data-search="replace">Reemplazar</button><button data-search="all">Todos</button><button data-search="close" aria-label="Cerrar búsqueda">×</button></div></section><section id="editor-pane" aria-label="Editor Markdown"><div class="pane-label">CÓDIGO MARKDOWN</div><div id="editor"></div></section><div id="splitter" role="separator" tabindex="0" aria-label="Ajustar paneles"></div><section id="preview-pane" aria-label="Vista previa"><div class="pane-label">VISTA PREVIA</div><div id="preview-scroll"><article id="preview"></article></div></section><aside id="outline" hidden aria-label="Índice de encabezados"></aside></div>
<footer><span id="stats">0 palabras</span><span id="cursor">Línea 1, columna 1</span><span id="encoding">UTF-8 · LF</span></footer></main></div>
<div id="toast" role="status" hidden></div><dialog id="graphic-dialog"><div class="modal-tools"><strong>Vista ampliada</strong><button id="dialog-close" aria-label="Cerrar vista ampliada"><i data-lucide="x"></i></button></div><div id="graphic-content"></div></dialog><dialog id="edit-dialog"><form method="dialog"><div class="modal-tools"><strong id="edit-title">Editar</strong><button value="cancel" aria-label="Cancelar">×</button></div><textarea id="edit-value" aria-label="Contenido"></textarea><div class="edit-actions"><button value="cancel">Cancelar</button><button value="apply" class="primary">Aplicar</button></div></form></dialog><script src="bundle.js"></script></body></html>
