name: macOS alternative release
on:
  push:
    tags: ['v*-macos.*', 'v*-macos-signed.*']
  workflow_dispatch:
    inputs:
      signing:
        description: Signing mode
        type: choice
        options: [adhoc, developer-id]
        default: adhoc
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      SIGNING_MODE: ${{ contains(github.ref_name, '-macos-signed.') && 'developer-id' || inputs.signing || 'adhoc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build ad-hoc package
        if: env.SIGNING_MODE == 'adhoc'
        run: npm run dist:mac -- --${{ matrix.arch }}
      - name: Build Developer ID package
        if: env.SIGNING_MODE == 'developer-id'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo '::error::Configure MACOS_CERTIFICATE_P12 and MACOS_CERTIFICATE_PASSWORD in repository Actions secrets.'
            exit 1
          fi
          npm run dist:mac:signed -- --${{ matrix.arch }}
      - name: Verify distributed signatures and audit installed application
        run: bash scripts/verify-macos.sh ${{ matrix.arch }} "$SIGNING_MODE"
      - name: Checksums
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip > SHA256-macOS-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256-*.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-macOS-${{ matrix.arch }}
          path: docs/previews/electron
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macOS-*
          merge-multiple: true
          path: release-assets
      - name: Publish alternative prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=docs/RELEASE-MACOS.md
          if [[ "$GITHUB_REF_NAME" == *-macos-signed.* ]]; then
            NOTES=docs/RELEASE-MACOS-SIGNED.md
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "Lecat Markdown $GITHUB_REF_NAME — macOS alternativa" \
            --notes-file "$NOTES"
