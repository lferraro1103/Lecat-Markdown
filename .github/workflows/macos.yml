name: macOS alternative release
on:
  push:
    tags: ['v*-macos.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:mac -- --${{ matrix.arch }}
      - name: Verify distributed signatures and audit installed application
        run: bash scripts/verify-macos.sh ${{ matrix.arch }}
      - name: Checksums
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip > SHA256-macOS-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256-*.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-macOS-${{ matrix.arch }}
          path: docs/previews/electron
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macOS-*
          merge-multiple: true
          path: release-assets
      - name: Publish alternative prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "Lecat Markdown 3.2.0 — macOS alternativa" \
            --notes-file docs/RELEASE-MACOS.md
