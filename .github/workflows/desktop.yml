name: Desktop alternative release
on:
  push:
    tags: ['v*-desktop.*', 'v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
jobs:
  build:
    if: ${{ !contains(github.ref_name, '-') || contains(github.ref_name, '-desktop.') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: Windows
            arch: x64
          - runner: macos-15
            platform: macOS
            arch: arm64
          - runner: macos-15-intel
            platform: macOS
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare verified Electron binary with retry
        run: node scripts/prepare-electron.cjs
      - run: npm test
      - name: Verify document session across real application restarts
        if: matrix.platform == 'Windows'
        run: npm run verify:session
      - name: Build macOS
        if: matrix.platform == 'macOS'
        run: npm run dist:mac -- --${{ matrix.arch }}
      - name: Verify macOS distributed packages
        if: matrix.platform == 'macOS'
        run: bash scripts/verify-macos.sh ${{ matrix.arch }} adhoc
      - name: macOS checksums
        if: matrix.platform == 'macOS'
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip > SHA256-macOS-${{ matrix.arch }}.txt
      - name: Preserve architecture-specific update metadata
        if: matrix.platform == 'macOS'
        run: |
          if [ -f dist/latest-mac.yml ]; then
            mv dist/latest-mac.yml dist/latest-mac-${{ matrix.arch }}.yml
          fi
      - name: Audit Windows application
        if: matrix.platform == 'Windows'
        run: npm run audit
      - name: Build Windows installer and portable
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          npm run installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $desktopVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $desktopZip = "dist/Lecat-Markdown-$desktopVersion-Windows-x64.zip"
          Compress-Archive -LiteralPath dist/win-unpacked -DestinationPath $desktopZip
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } |
            ForEach-Object { "$( (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)" } |
            Set-Content -LiteralPath dist/SHA256-Windows-x64.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*-Setup-x64.exe
            dist/SHA256-*.txt
            dist/latest*.yml
            dist/*.blockmap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: docs/previews/electron
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Merge stable macOS update metadata
        if: ${{ !contains(github.ref_name, '-') }}
        run: node scripts/merge-update-metadata.cjs release-assets
      - name: Sign Mac update manifests
        env:
          LECAT_UPDATE_PRIVATE_KEY: ${{ secrets.LECAT_UPDATE_PRIVATE_KEY }}
        run: node scripts/sign-mac-updates.cjs release-assets
      - name: Publish Windows and macOS alternative release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=(--prerelease --latest=false)
          NOTES=docs/RELEASE-DESKTOP.md
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            FLAGS=(--latest)
            NOTES=docs/RELEASE-STABLE.md
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag "${FLAGS[@]}" \
            --title "Lecat Markdown $GITHUB_REF_NAME — Windows y macOS" \
            --notes-file "$NOTES"
      - name: Publish stable update assets to public repository
        if: ${{ !contains(github.ref_name, '-') && github.repository != 'lferraro1103/Lecat-Markdown' }}
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Configure PUBLIC_RELEASE_TOKEN with contents:write access to lferraro1103/Lecat-Markdown to publish public updates from the private repository.'
            exit 1
          fi
          # The public source/tag is synchronized separately using the existing
          # selective publication process. Never export private source here.
          if gh release view "$GITHUB_REF_NAME" --repo lferraro1103/Lecat-Markdown >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --repo lferraro1103/Lecat-Markdown --clobber
            gh release edit "$GITHUB_REF_NAME" --repo lferraro1103/Lecat-Markdown --latest --draft=false --prerelease=false --notes-file docs/RELEASE-STABLE.md
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --repo lferraro1103/Lecat-Markdown --verify-tag --latest \
              --title "Lecat Markdown $GITHUB_REF_NAME — Windows y macOS" --notes-file docs/RELEASE-STABLE.md
          fi
