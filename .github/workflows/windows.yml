name: Electron Windows build and audit
on: [push, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run audit
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ClaroMD-Electron-Windows-x64
          path: |
            dist/win-unpacked
            docs/previews/electron
